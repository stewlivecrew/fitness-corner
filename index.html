<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8" />

<meta name="description" content="Generate a workout from whatever's at your Singapore fitness corner." />
<meta name="theme-color" content="#1E4D2B" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Fitness Corner" />

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=9768eb68" />
<link rel="preload" href="assets/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/barlow-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(assets/fonts/barlow-latin-500-normal.woff2) format('woff2');}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/barlow-latin-600-normal.woff2) format('woff2');}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/barlow-condensed-latin-600-normal.woff2) format('woff2');}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(assets/fonts/barlow-condensed-latin-700-normal.woff2) format('woff2');}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(assets/fonts/barlow-condensed-latin-800-normal.woff2) format('woff2');}
html,body,#root{margin:0;padding:0;} body{background:#F2F4EF;-webkit-tap-highlight-color:transparent;}
</style>
</head>
<body>
<div id="root"></div>
<noscript>This app needs JavaScript.</noscript>
<script>
// localStorage-backed shim matching the Claude artifact storage API,
// so the logging/corners/auto-level features work in any browser.
window.storage = {
  async get(key) {
    const v = localStorage.getItem("fc:" + key);
    if (v === null) throw new Error("key not found: " + key);
    return { key, value: v, shared: false };
  },
  async set(key, value) {
    localStorage.setItem("fc:" + key, String(value));
    return { key, value, shared: false };
  },
  async delete(key) {
    localStorage.removeItem("fc:" + key);
    return { key, deleted: true, shared: false };
  },
  async list(prefix = "") {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("fc:" + prefix)) keys.push(k.slice(3));
    }
    return { keys, prefix, shared: false };
  },
};
</script>
<script src="assets/app.js?v=7eebf152c12a"></script>
<script>
// Offline support: register the service worker; when a new version takes
// over, offer a reload (in-progress sessions are persisted, so it's safe).
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("SW registration failed", e));
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || document.getElementById("fc-update")) return;
    const b = document.createElement("button");
    b.id = "fc-update";
    b.textContent = "New version ready — tap to reload";
    b.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:9999;background:#F5B700;color:#143620;border:none;border-radius:999px;padding:12px 18px;font:700 15px 'Barlow Condensed',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 4px 14px rgba(0,0,0,.25)";
    b.onclick = () => location.reload();
    document.body.appendChild(b);
  });
}
</script>
</body>
</html>
