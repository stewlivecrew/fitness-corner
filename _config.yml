# GitHub Pages (Jekyll) settings: publish only the built app.
# sandbox.html (dev copy that loads Babel from a CDN) and the source/docs
# stay in the repo but are not served on the live site.
exclude:
  - sandbox.html
  - fitness-corner-generator.jsx
  - CLAUDE.md
  - exercises.md
  - scripts/
  - build/
  - package.json
  - package-lock.json
  - eslint.config.mjs
  - node_modules/
  - icons/icon-source.png
